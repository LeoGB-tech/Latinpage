<meta name="mobile-web-app-capable" content="yes">

<title>Verba</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bone:#EFE6D4;
  --gold:#D3B26E;
  --ease:cubic-bezier(.22,.8,.18,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#2B1719;
  transition:background-color .9s ease;
  display:grid;place-items:center;overflow:hidden;
  font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  color:var(--bone);
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
#app{
  position:relative;
  height:min(92vh,880px);
  width:calc(min(92vh,880px) * .5);
  border-radius:36px;
  overflow:hidden;
  isolation:isolate;
  background:#1d1214;
  box-shadow:0 50px 90px -40px rgba(0,0,0,.7),0 0 0 1px rgba(239,230,212,.07);
  container-type:size;
  touch-action:none;
  cursor:pointer;
}
@media (max-width:640px){
  #app{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
#stage{position:absolute;inset:0}

.slide{
  position:absolute;inset:0;overflow:hidden;
  background:var(--c);
  background:radial-gradient(130% 90% at 85% 5%,color-mix(in oklab,var(--c) 88%,#fff 12%) 0%,var(--c) 45%,color-mix(in oklab,var(--c) 55%,#000 45%) 100%);
  box-shadow:0 0 70px rgba(0,0,0,.45);
  will-change:transform;
}
.art{
  position:absolute;width:118cqw;height:118cqw;
  top:-2cqh;right:-38cqw;
  opacity:.42;
  -webkit-mask-image:radial-gradient(circle at 55% 45%,#000 42%,transparent 72%);
  mask-image:radial-gradient(circle at 55% 45%,#000 42%,transparent 72%);
}
.art svg{width:100%;height:100%;display:block}
.veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 25%,color-mix(in oklab,var(--c) 45%,#000 55%) 100%);
}
.content{position:absolute;left:8cqw;right:9cqw;bottom:28cqh}
.la{
  margin:0;font-weight:700;line-height:1.08;letter-spacing:-.005em;
  text-wrap:balance;
}
.la span{
  display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(8px);
  animation:rise .8s var(--ease) forwards;
  animation-delay:calc(var(--i) * 60ms + 160ms);
}
.fr{
  margin:1.1em 0 0;font-style:italic;font-weight:500;
  font-size:clamp(16px,5.2cqw,22px);line-height:1.42;
  max-width:36ch;color:color-mix(in oklab,var(--bone) 82%,transparent);
  opacity:0;animation:fade .9s ease forwards;animation-delay:var(--d);
  text-wrap:pretty;
}
.by{
  position:absolute;right:8cqw;bottom:calc(6.5cqh + env(safe-area-inset-bottom));
  text-align:right;max-width:70cqw;
  opacity:0;animation:fade .9s ease forwards;animation-delay:calc(var(--d) + 200ms);
}
.who{display:block;font-family:Cinzel,serif;font-weight:600;font-size:clamp(13px,3.9cqw,16px);letter-spacing:.06em;color:var(--gold)}
.src,.when{display:block;font-style:italic;font-size:clamp(14px,4cqw,17px);line-height:1.3;color:color-mix(in oklab,var(--bone) 70%,transparent)}
.when{margin-top:2px}

/* accueil */
.home .art{width:96cqw;height:96cqw;top:5cqh;right:2cqw;opacity:.92;-webkit-mask-image:none;mask-image:none}
.home .veil{background:linear-gradient(180deg,transparent 45%,color-mix(in oklab,var(--c) 40%,#000 60%) 100%)}
.home .content{bottom:17cqh}
.title{margin:0;font-weight:700;font-size:25cqw;line-height:.9;letter-spacing:-.02em;opacity:0;animation:rise 1.1s var(--ease) .15s forwards}
.lede{margin:.6em 0 0;font-style:italic;font-size:clamp(17px,5.4cqw,23px);line-height:1.35;max-width:26ch;opacity:0;animation:fade 1s ease .6s forwards}
.hint{
  position:absolute;left:8cqw;bottom:calc(7cqh + env(safe-area-inset-bottom));
  font-size:clamp(14px,4cqw,17px);font-style:italic;color:color-mix(in oklab,var(--bone) 65%,transparent);
  opacity:0;animation:fade 1s ease 1.1s forwards;
}
.edge{
  position:absolute;right:0;top:50%;width:3px;height:64px;margin-top:-32px;border-radius:3px 0 0 3px;
  background:var(--gold);opacity:.0;animation:pulse 2.4s ease-in-out 1.4s infinite;
}

/* chrome */
.bar{position:absolute;z-index:5;top:calc(16px + env(safe-area-inset-top));left:8cqw;right:8cqw;height:2px;border-radius:2px;background:rgba(239,230,212,.16);transition:opacity .5s}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--bone);transition:width .6s var(--ease)}
.idx{position:absolute;z-index:5;top:calc(30px + env(safe-area-inset-top));left:8cqw;font-family:Cinzel,serif;font-size:14px;letter-spacing:.08em;color:var(--gold);transition:opacity .5s}
.idx small{font-size:11px;opacity:.55;margin-left:.35em}
.is-home .bar,.is-home .idx{opacity:0}

@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:0;transform:translateX(3px)}50%{opacity:.8;transform:none}}

@media (prefers-reduced-motion:reduce){
  .la span,.title{filter:none;transform:none;animation-duration:.01s;animation-delay:0s}
  .fr,.by,.lede,.hint{animation-duration:.2s;animation-delay:0s}
  .edge{animation:none;opacity:.5}
}
</style>

  if (f.beard === "full") {
    beard += `<path d="M210,276 C212,336 242,386 292,388 C322,389 338,368 332,338 L324,314 C316,326 304,332 294,334 C276,334 258,318 246,300 C236,288 224,282 210,276Z" fill="${H}" fill-opacity=".85"/>`;
    for (let i = 0; i < 7; i++) beard += `<path d="M${232 + i * 13},${320 + (i % 2) * 14} q6,18 -2,32" fill="none" stroke="${L}" stroke-opacity=".45" stroke-width="2.2"/>`;
  }
  if (f.beard === "short") {
    beard += `<path d="M222,292 C230,334 256,366 296,368 C314,368 326,356 324,334 C312,344 300,348 290,346 C270,342 246,318 222,292Z" fill="${H}" fill-opacity=".7"/>`;
  }
  if (f.mous) beard += `<path d="M298,290 C306,280 320,280 326,286 C320,294 306,296 298,290Z" fill="${H}"/>`;

  if (f.collar === "toga") {
    collar = `<path d="M40,500 C70,440 130,418 180,424 L262,424 C310,430 350,460 380,500Z" fill="url(#g${id})"/>
      <path d="M140,444 C200,474 262,470 336,466 M110,478 C190,506 290,496 356,490 M184,426 C224,462 252,488 262,500 M240,426 C270,450 300,470 320,500" fill="none" stroke="${L}" stroke-opacity=".45" stroke-width="2.4"/>`;
  }
  if (f.collar === "robe") {
    collar = `<path d="M30,500 C60,436 130,410 182,416 L270,416 C320,424 360,458 390,500Z" fill="${H}" fill-opacity=".85"/>
      <path d="M150,430 L130,500 M200,420 L190,500 M250,420 L262,500 M300,432 L330,500" stroke="${L}" stroke-opacity=".4" stroke-width="2.2"/>`;
  }
  if (f.collar === "ruff") {
    for (let row = 0; row < 2; row++) for (let x = 120; x <= 330; x += 19)
      collar += curl(x + row * 9, 424 + row * 18, 13, 1).replace(H, G);
    collar = `<path d="M40,500 C80,452 140,440 200,440 L270,440 C320,446 360,468 380,500Z" fill="#2A2018" fill-opacity=".85"/>` + collar;
  }
  if (f.collar === "band") {
    collar = `<path d="M40,500 C80,446 140,428 196,430 L276,430 C326,436 362,466 384,500Z" fill="#2A2018" fill-opacity=".85"/>
      <path d="M232,430 L300,430 L292,478 L240,478Z" fill="${G}" fill-opacity=".9"/>`;
  }

  const dots = Array.from({length: 72}, (_, i) => {
    const k = i / 72 * Math.PI * 2; return `<circle cx="${(250 + 212 * Math.cos(k)).toFixed(1)}" cy="${(250 + 212 * Math.sin(k)).toFixed(1)}" r="1.6" fill="#D3B26E" fill-opacity=".55"/>`;
  }).join("");

  return `<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <clipPath id="c${id}"><circle cx="250" cy="250" r="200"/></clipPath>
    <radialGradient id="g${id}" cx="68%" cy="36%" r="75%">
      <stop offset="0" stop-color="${G}" stop-opacity=".96"/><stop offset=".55" stop-color="#CBA762" stop-opacity=".62"/><stop offset="1" stop-color="#6E5326" stop-opacity=".4"/>
    </radialGradient>
    <path id="p${id}" d="M28,250 A222,222 0 1,1 472,250 A222,222 0 1,1 28,250"/>
  </defs>
  <circle cx="250" cy="250" r="240" fill="none" stroke="#D3B26E" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="250" cy="250" r="201" fill="#D3B26E" fill-opacity=".05" stroke="#D3B26E" stroke-opacity=".5" stroke-width="1.5"/>
  ${dots}
  <text font-family="Cinzel,serif" font-weight="600" font-size="21" letter-spacing="5" fill="#E0C68D" text-anchor="middle"><textPath href="#p${id}" startOffset="25%">${a.la}</textPath></text>
  <g clip-path="url(#c${id})"><g transform="translate(14,20)">
    <path d="M200,88 C260,86 300,120 306,170 C308,185 306,195 312,205 L318,212 C320,222 318,228 322,238 L338,268 C340,274 336,278 328,278 L322,282 C326,288 326,292 322,296 C326,300 326,306 320,310 C316,318 318,326 320,334 C322,350 312,360 296,362 C280,364 266,360 256,356 L262,420 C265,440 272,460 290,480 L110,480 C130,450 140,420 138,390 C120,370 104,330 102,280 C100,200 130,90 200,88Z" fill="url(#g${id})"/>
    <path d="M232,318 C250,346 272,358 296,362 M322,272 q-7,4 -2,9 M322,297 l-12,2" fill="none" stroke="${L}" stroke-opacity=".45" stroke-width="2.2"/>
    <path d="M280,204 Q298,196 316,208" fill="none" stroke="${L}" stroke-opacity=".55" stroke-width="2.6"/>
    <path d="M284,222 Q295,215 306,223 Q295,228 284,222Z" fill="${L}" fill-opacity=".5"/>
    <path d="M212,232 C194,236 192,272 214,282 C224,272 224,244 212,232Z M210,246 q-8,10 2,22" fill="none" stroke="${L}" stroke-opacity=".5" stroke-width="2.2"/>
    ${collar}${hair}${beard}${extra}
  </g></g>
</svg>`;
}

/* ---------- Utilitaires ---------- */
const roman = n => { const v=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let s=""; for (const [x,r] of v) while (n>=x){s+=r;n-=x} return s; };
const shade = (hex, k) => { const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(x=>Math.round(x*k)); return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join(""); };
const TOTAL = Q.length;

const app = document.getElementById("app");
const stage = document.getElementById("stage");
const barFill = document.querySelector(".bar i");
const idxEl = document.querySelector(".idx");
const meta = document.querySelector('meta[name="theme-color"]');
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function build(i){
  const s = document.createElement("section");
  if (i === 0) {
    const a = A.cesar;
    s.className = "slide home";
    s.style.setProperty("--c", a.c);
    s.innerHTML = `<div class="art">${medal(a)}</div><div class="veil"></div>
      <div class="content"><h1 class="title">Verba</h1>
      <p class="lede">Cinquante et une phrases latines, de Plaute à Newton.</p></div>
      <p class="hint">Touchez la droite de l’image pour commencer</p>
      <span class="edge"></span>`;
    s.setAttribute("aria-label", "Accueil");
    return s;
  }
  const [k, la, fr, src, when] = Q[i - 1], a = A[k];
  const words = la.split(" ");
  const len = la.length;
  const size = len < 22 ? 12.5 : len < 42 ? 10 : len < 64 ? 8.4 : 7;
  s.className = "slide";
  s.style.setProperty("--c", a.c);
  s.style.setProperty("--d", (words.length * 60 + 420) + "ms");
  s.innerHTML = `<div class="art">${medal(a)}</div><div class="veil"></div>
    <div class="content">
      <p class="la" lang="la" style="font-size:${size}cqw">${words.map((w, j) => `<span style="--i:${j}">${w}</span>`).join(" ")}</p>
      <p class="fr">${fr}</p>
    </div>
    <footer class="by"><span class="who">${a.fr}</span><span class="src">${src}</span><span class="when">${when}</span></footer>`;
  return s;
}

let index = 0;
try { const v = parseInt(localStorage.getItem("verba-index"), 10); if (v >= 0 && v <= TOTAL) index = v; } catch (e) {}
let cur = build(index);
stage.appendChild(cur);
let running = [];

function chrome(){
  const c = index === 0 ? A.cesar.c : A[Q[index - 1][0]].c;
  document.body.style.backgroundColor = shade(c, .55);
  meta.setAttribute("content", c);
  app.classList.toggle("is-home", index === 0);
  barFill.style.width = (index / TOTAL * 100) + "%";
  idxEl.innerHTML = index ? `${roman(index)}<small>/ ${roman(TOTAL)}</small>` : "";
  try { localStorage.setItem("verba-index", index); } catch (e) {}
}
chrome();

function go(target, dir, fromDx = 0){
  running.forEach(an => an.finish());
  running = [];
  const old = cur, nw = build(target);
  stage.appendChild(nw);
  const opt = {duration: reduce ? 1 : 640, easing: "cubic-bezier(.22,.8,.18,1)", fill: "forwards"};
  const a1 = old.animate([
    {transform: `translateX(${fromDx}px)`, filter: "brightness(1)"},
    {transform: `translateX(${-dir * 28}%) scale(.9)`, filter: "brightness(.4)"}
  ], opt);
  const a2 = nw.animate([
    {transform: `translateX(calc(${dir * 100}% + ${fromDx}px))`},
    {transform: "translateX(0)"}
  ], opt);
  a1.onfinish = () => old.remove();
  a2.onfinish = () => { a2.cancel(); nw.style.transform = ""; };
  running = [a1, a2];
  cur = nw; index = target; chrome();
}
const next = (dx = 0) => go(index >= TOTAL ? 0 : index + 1, 1, dx);
const prev = (dx = 0) => { if (index === 0) return bounce(); go(index - 1, -1, dx); };
function bounce(){
  cur.animate([{transform:"translateX(0)"},{transform:"translateX(14px)"},{transform:"translateX(0)"}],{duration:380,easing:"ease-out"});
}

/* ---------- Gestes ---------- */
let sx = 0, t0 = 0, dx = 0, down = false;
app.addEventListener("pointerdown", e => {
  down = true; sx = e.clientX; t0 = performance.now(); dx = 0;
  app.setPointerCapture(e.pointerId);
});
app.addEventListener("pointermove", e => {
  if (!down) return;
  dx = e.clientX - sx;
  if (index === 0 && dx > 0) dx *= .25;
  if (Math.abs(dx) > 6 && !running.some(a => a.playState === "running"))
    cur.style.transform = `translateX(${dx}px) scale(${1 - Math.min(Math.abs(dx) / app.clientWidth, 1) * .05})`;
});
app.addEventListener("pointerup", e => {
  if (!down) return; down = false;
  const dt = performance.now() - t0, w = app.clientWidth;
  if (Math.abs(dx) < 8) {
    cur.style.transform = "";
    const r = app.getBoundingClientRect();
    (e.clientX - r.left) > r.width / 2 ? next() : prev();
  } else if (Math.abs(dx) > w * .18 || Math.abs(dx) / dt > .55) {
    const d = dx; cur.style.transform = "";
    d < 0 ? next(d) : prev(d);
  } else {
    const from = cur.style.transform; cur.style.transform = "";
    cur.animate([{transform: from}, {transform: "none"}], {duration: 420, easing: "cubic-bezier(.22,.8,.18,1)"});
  }
});
app.addEventListener("pointercancel", () => { down = false; cur.style.transform = ""; });

addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
});

/* ---------- Service worker ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
